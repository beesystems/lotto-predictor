<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotto Predictor Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="active">Dashboard</a>
    <a href="model.html">Model</a>
    <a href="donate.html">Donate</a>
  </nav>

  <main class="grid">

    <!-- PREDICTION CONTROLS -->
    <section class="card">
      <h3>Prediction Mode</h3>
      <select id="mode">
        <option value="hybrid">Hybrid (Balanced)</option>
        <option value="conservative">Conservative (Stable)</option>
        <option value="aggressive">Aggressive (Hot/Recent)</option>
      </select>
      <button id="predictBtn" class="primary-btn">Predict Next Draw</button>
    </section>

    <!-- MAIN PREDICTION (SET 1 ONLY) -->
    <section id="prediction" class="card">
      <h3>Prediction (Most Likely Set)</h3>
      <div class="number-badges"></div>
    </section>

    <!-- STRUCTURAL RADAR CHART -->
    <section class="card">
      <h3>Structural Balance</h3>
      <canvas id="structuralChart"></canvas>
    </section>

    <!-- RANKED SETS (SETS 2–10) -->
    <section id="ranked-sets" class="grid"></section>

    <!-- FREQUENCY TABLE -->
    <section class="card">
      <h3>Frequency Table</h3>
      <div id="frequency-table"></div>
    </section>

    <!-- FREQUENCY CHART -->
    <section class="card">
      <h3>Frequency Chart</h3>
      <canvas id="frequencyChart"></canvas>
    </section>

    <!-- RECENCY CHART -->
    <section class="card">
      <h3>Recency Chart</h3>
      <canvas id="recencyChart"></canvas>
    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
