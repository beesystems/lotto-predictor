<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotto Predictor</title>

  <!-- Add your favicon here -->
  <link rel="icon" type="image/png" href="favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html">Dashboard</a>
    <a href="add-draw.html">Add Draw</a>
    <a href="model.html">Model</a>
    <a href="donate.html">Donate</a>
  </nav>

  <main class="grid">
    <section class="column">
      <div class="card">
        <h3>Prediction Mode</h3>
        <select id="mode">
          <option value="conservative">Conservative</option>
          <option value="hybrid" selected>Hybrid</option>
          <option value="aggressive">Aggressive</option>
        </select>
        <button id="predictBtn" class="primary-btn">Predict Next Draw</button>
      </div>
    </section>

    <section class="column">
      <div class="card" id="prediction">
        <h3>Predicted Numbers</h3>
        <div class="number-badges"></div>
      </div>

      <div class="card">
        <h3>Frequency</h3>
        <canvas id="frequencyChart"></canvas>
      </div>

      <div class="card">
        <h3>Frequency Table</h3>
        <div id="frequency-table"></div>
      </div>

      <div class="card">
        <h3>Recency (Last 20 Draws)</h3>
        <canvas id="recencyChart"></canvas>
      </div>

      <div class="card">
        <h3>Structural Score</h3>
        <canvas id="structuralChart"></canvas>
      </div>
    </section>
  </main>
  
  <script src="app.js"></script>
</body>
</html>
