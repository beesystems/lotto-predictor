<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Draw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html">Dashboard</a>
    <a href="add-draw.html">Add Draw</a>
    <a href="model.html">Model</a>
    <a href="donate.html">Donate</a>
  </nav>

  <main class="single">
    <div class="card">
      <h3>Add New Draw</h3>
      <div class="draw-inputs">
        <input type="number" id="n1" placeholder="Number 1">
        <input type="number" id="n2" placeholder="Number 2">
        <input type="number" id="n3" placeholder="Number 3">
        <input type="number" id="n4" placeholder="Number 4">
        <input type="number" id="n5" placeholder="Number 5">
        <input type="number" id="n6" placeholder="Number 6">
        <input type="number" id="bonus" placeholder="Bonus">
      </div>
      <button id="addDrawBtn" class="primary-btn">Save Draw</button>
      <p class="hint">Draws are stored locally in your browser.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
