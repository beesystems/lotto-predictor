<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h2>Lotto Predictor</h2>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html">Dashboard</a>
    <a href="model.html">Model</a>
    <a href="random.html" class="active">Random Sets</a>
    <a href="donate.html">Donate</a>
  </nav>
</aside>

  <!-- MAIN CONTENT -->
  <div class="main-layout">

    <header class="topbar">
      <h1>Smart Random Generator</h1>
      <p>Create up to 20 random 6-number combinations using your prediction engine’s frequency data.</p>
    </header>

    <main class="content-grid">

      <!-- LEFT COLUMN -->
      <section class="column">

        <!-- Controls -->
        <section class="card">
          <h3>Generate Random Sets</h3>

          <label style="font-weight:600;">Number of Sets (1–20):</label>
          <input type="number" id="setCount" min="1" max="20" value="10" style="margin:0.5rem 0; padding:0.4rem; width:80px;">

          <div style="margin:0.75rem 0;">
            <input type="checkbox" id="avoidHot">
            <label for="avoidHot" style="font-weight:600;">Avoid Hot Numbers</label>
          </div>

          <div style="margin:0.75rem 0;">
            <input type="checkbox" id="avoidCold">
            <label for="avoidCold" style="font-weight:600;">Avoid Cold Numbers</label>
          </div>

          <div style="margin:0.75rem 0;">
            <input type="checkbox" id="avoidConsecutive">
            <label for="avoidConsecutive" style="font-weight:600;">Avoid Consecutive Numbers</label>
          </div>

          <div style="margin:0.75rem 0;">
            <input type="checkbox" id="includeBonus">
            <label for="includeBonus" style="font-weight:600;">Include Bonus Number</label>
          </div>

          <label style="font-weight:600;">Sum Range:</label>
          <div style="display:flex; gap:0.5rem; margin:0.5rem 0;">
            <input type="number" id="sumMin" value="100" style="padding:0.4rem; width:80px;">
            <input type="number" id="sumMax" value="180" style="padding:0.4rem; width:80px;">
          </div>

          <button id="generateRandomBtn" class="primary-btn">Generate Sets</button>
          <button id="copyBtn" class="primary-btn" style="margin-left:0.5rem;">Copy All Sets</button>
          <button id="printBtn" class="primary-btn" style="margin-left:0.5rem;">Print Layout</button>
        </section>

        <!-- Results -->
        <section id="random-results" class="card">
          <h3>Your Random Sets</h3>
          <div id="random-list"></div>
        </section>

      </section>

      <!-- RIGHT COLUMN -->
      <section class="column"></section>

    </main>
  </div>

  <!-- Use your existing engine -->
  <script src="app.js"></script>

  <script>
    /* ============================================================
       RANDOM SET GENERATOR (NO STRUCTURAL FILTERING)
    ============================================================ */
    function generateRandomSet(options) {
      let set = [];
      let safety = 0;

      while (set.length < 6 && safety < 500) {
        safety++;

        const n = Math.floor(Math.random() * 49) + 1;
        if (set.includes(n)) continue;

        const category = classifyFrequency(frequencyCache, n);

        if (options.avoidHot && category === "hot") continue;
        if (options.avoidCold && category === "cold") continue;

        if (options.avoidConsecutive && set.some(x => Math.abs(x - n) === 1)) continue;

        set.push(n);
      }

      if (set.length < 6) return null;

      set.sort((a,b) => a - b);

      const sum = set.reduce((a,b) => a + b, 0);
      if (sum < options.sumMin || sum > options.sumMax) return null;

      if (options.includeBonus) {
        let bonusSafety = 0;
        let bonus;
        while (bonusSafety < 200) {
          bonusSafety++;
          bonus = Math.floor(Math.random() * 49) + 1;
          if (!set.includes(bonus)) break;
        }
        return { main: set, bonus };
      }

      return { main: set };
    }

    /* ============================================================
       GENERATE MULTIPLE SETS
    ============================================================ */
    async function generateSets() {
      if (!frequencyCache || Object.values(frequencyCache).every(v => v === 0)) {
        alert("Frequency data is still loading. Try again in a second.");
        return;
      }

      const count = Math.min(20, Math.max(1, parseInt(document.getElementById("setCount").value)));
      const options = {
        avoidHot: document.getElementById("avoidHot").checked,
        avoidCold: document.getElementById("avoidCold").checked,
        avoidConsecutive: document.getElementById("avoidConsecutive").checked,
        includeBonus: document.getElementById("includeBonus").checked,
        sumMin: parseInt(document.getElementById("sumMin").value),
        sumMax: parseInt(document.getElementById("sumMax").value)
      };

      const container = document.getElementById("random-list");
      container.innerHTML = "";

      for (let i = 0; i < count; i++) {
        let result = null;
        let attempts = 0;

        while (!result && attempts < 1000) {
          result = generateRandomSet(options);
          attempts++;
        }

        if (!result) {
          const fail = document.createElement("div");
          fail.textContent = `Set ${i+1}: No valid combination found with current rules.`;
          container.appendChild(fail);
          continue;
        }

        const wrapper = document.createElement("div");
        wrapper.style.marginBottom = "1rem";

        const title = document.createElement("div");
        title.style.fontWeight = "600";
        title.style.marginBottom = "0.5rem";
        title.textContent = `Set ${i+1}`;
        wrapper.appendChild(title);

        const badgeContainer = document.createElement("div");
        badgeContainer.className = "number-badges";

        result.main.forEach(num => {
          const badge = document.createElement("div");
          badge.className = "badge";
          badge.classList.add(classifyFrequency(frequencyCache, num));
          badge.textContent = num;
          badgeContainer.appendChild(badge);
        });

        if (options.includeBonus) {
          const bonusBadge = document.createElement("div");
          bonusBadge.className = "badge";
          bonusBadge.classList.add(classifyFrequency(frequencyCache, result.bonus));
          bonusBadge.style.border = "2px solid #1e40af";
          bonusBadge.textContent = `Bonus ${result.bonus}`;
          badgeContainer.appendChild(bonusBadge);
        }

        wrapper.appendChild(badgeContainer);
        container.appendChild(wrapper);
      }
    }

    document.getElementById("generateRandomBtn").addEventListener("click", generateSets);

    /* ============================================================
       COPY + PRINT
    ============================================================ */
    document.getElementById("copyBtn").addEventListener("click", () => {
      const sets = [...document.querySelectorAll("#random-list")].map(d => d.textContent).join("\n");
      navigator.clipboard.writeText(sets);
      alert("All sets copied to clipboard!");
    });

    document.getElementById("printBtn").addEventListener("click", () => {
      const sets = [...document.querySelectorAll("#random-list div")].map(d => d.textContent);

      const printWindow = window.open("", "", "width=600,height=800");
      printWindow.document.write("<html><head><title>Print Ticket Sets</title>");
      printWindow.document.write("<style>");
      printWindow.document.write("body { font-family: Segoe UI, sans-serif; padding: 20px; }");
      printWindow.document.write("h2 { margin-bottom: 1rem; }");
      printWindow.document.write(".ticket { margin-bottom: 0.75rem; font-size: 1.2rem; font-weight: 600; }");
      printWindow.document.write("</style></head><body>");
      printWindow.document.write("<h2>Your Ticket Sets</h2>");

      sets.forEach(s => {
        printWindow.document.write(`<div class='ticket'>${s}</div>`);
      });

      printWindow.document.write("</body></html>");
      printWindow.document.close();
      printWindow.print();
    });
  </script>

</body>
</html>
